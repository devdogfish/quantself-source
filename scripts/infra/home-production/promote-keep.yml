# Install as .github/workflows/promote-keep.yml in the private Atlas control repository.
name: Promote Keep production
run-name: Promote Quantself ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact staged and approved Quantself source commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  relay:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' && github.ref_protected &&
          github.repository_id == vars.ATLAS_CONTROL_REPOSITORY_ID &&
          github.actor_id == vars.ATLAS_CONTROL_ACTOR_ID &&
          github.repository != 'devdogfish/quantself' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - quantself-atlas-control
      - ${{ format('quantself-atlas-control-{0}-{1}', github.run_id, github.run_attempt) }}
    environment: atlas-production
    timeout-minutes: 45
    steps:
      - name: Promote the staged release over pinned OpenSSH
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_REPOSITORY_ID: ${{ vars.ATLAS_CONTROL_REPOSITORY_ID }}
          CONTROL_ACTOR_ID: ${{ vars.ATLAS_CONTROL_ACTOR_ID }}
          CONTROL_SSH_HOST: ${{ vars.ATLAS_CONTROL_SSH_HOST }}
          CONTROL_SSH_KNOWN_HOST: ${{ vars.ATLAS_CONTROL_SSH_KNOWN_HOST }}
          CONTROL_SSH_KEY: ${{ secrets.ATLAS_CONTROL_SSH_KEY }}
          CONTROL_JOB_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          export LC_ALL=C
          reject() { printf '%s\n' 'Atlas promotion failed. Check the staged signed evidence and Keep broker journal.' >&2; exit 1; }
          unset token ssh_key
          token=${CONTROL_JOB_TOKEN-}
          ssh_key=${CONTROL_SSH_KEY-}
          unset CONTROL_JOB_TOKEN CONTROL_SSH_KEY
          shopt -s nocasematch
          [[ ${GITHUB_REPOSITORY-} != devdogfish/quantself ]] || reject
          shopt -u nocasematch

          [[ ${GITHUB_SERVER_URL-} == https://github.com &&
             ${GITHUB_EVENT_NAME-} == workflow_dispatch &&
             ${GITHUB_REF-} == refs/heads/main && ${GITHUB_REF_PROTECTED-} == true &&
             ${CONTROL_REPOSITORY_ID-} =~ ^[1-9][0-9]{0,19}$ &&
             ${GITHUB_REPOSITORY_ID-} == "$CONTROL_REPOSITORY_ID" &&
             ${CONTROL_ACTOR_ID-} =~ ^[1-9][0-9]{0,19}$ &&
             ${GITHUB_ACTOR_ID-} == "$CONTROL_ACTOR_ID" &&
             -n ${GITHUB_ACTOR-} && ${GITHUB_ACTOR-} == "${GITHUB_TRIGGERING_ACTOR-}" &&
             ${SOURCE_SHA-} =~ ^[0-9a-f]{40}$ &&
             ${GITHUB_RUN_ID-} =~ ^[1-9][0-9]{0,19}$ &&
             ${GITHUB_RUN_ATTEMPT-} =~ ^[1-9][0-9]{0,9}$ ]] || reject
          [[ ${#token} -lt 4096 && $token =~ ^ghs_[A-Za-z0-9_.-]+$ &&
             -n $ssh_key && ${#ssh_key} -le 8192 ]] || reject

          host=${CONTROL_SSH_HOST-}
          pin=${CONTROL_SSH_KNOWN_HOST-}
          [[ $host =~ ^[a-z0-9][a-z0-9.-]{0,252}$ ]] || reject
          prefix="$host ssh-ed25519 "
          [[ $pin == "$prefix"* ]] || reject
          [[ ${pin#"$prefix"} =~ ^[A-Za-z0-9+/]{68}$ ]] || reject

          scratch=$(mktemp -d) || reject
          trap 'rm -rf -- "$scratch"' EXIT
          printf '%s\n' "$ssh_key" > "$scratch/identity"
          unset ssh_key
          printf '%s\n' "$pin" > "$scratch/known_hosts"
          printf '%s\n' QUANTSELF_DEPLOY_OK > "$scratch/expected"
          reply_limit=$(( $(wc -c < "$scratch/expected") + 1 ))

          if ! printf '%s\n' "$token" |
            timeout --kill-after=5s 42m ssh -F /dev/null -T -x \
              -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none -o PreferredAuthentications=publickey \
              -o ClearAllForwardings=yes -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
              -o HostKeyAlgorithms=ssh-ed25519 -o GlobalKnownHostsFile=/dev/null \
              -o UserKnownHostsFile="$scratch/known_hosts" -o ConnectTimeout=8 \
              -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -i "$scratch/identity" \
              -- "deploy-atlas@$host" "promote-atlas $SOURCE_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" 2>/dev/null |
            head -c "$reply_limit" > "$scratch/reply"; then
            reject
          fi
          unset token
          cmp -s "$scratch/expected" "$scratch/reply" || reject
          printf '%s\n' 'Keep promotion acknowledged.'
